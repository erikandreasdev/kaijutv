name: Deploy

# Builds the static site and publishes it to Cloudflare Workers.
# Requires these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN      — token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID     — Cloudflare account ID
#   PUBLIC_SANITY_PROJECT_ID  — Sanity project ID
#   SANITY_API_TOKEN          — Sanity read token (build time only)
# And optionally these repository variables:
#   PUBLIC_SITE_URL, PUBLIC_CONTACT_ENDPOINT, PUBLIC_CONTACT_ACCESS_KEY,
#   PUBLIC_TURNSTILE_SITE_KEY

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET || 'production' }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT }}
          PUBLIC_CONTACT_ACCESS_KEY: ${{ vars.PUBLIC_CONTACT_ACCESS_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
